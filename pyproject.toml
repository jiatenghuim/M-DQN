[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdqn"
version = "0.1.0"
description = "Paper-faithful PyTorch baseline for Munchausen DQN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
atari = [
  "ale-py>=0.10",
  "gymnasium[atari]>=1.0,<2",
  "opencv-python>=4.8",
  "tensorboard>=2.14",
]
test = ["pytest>=8"]
tracking = ["swanlab>=0.9,<1"]

[project.scripts]
mdqn-train = "mdqn.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
